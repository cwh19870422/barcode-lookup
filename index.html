function qkResizeImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('讀取圖片失敗'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('不是有效的圖片'));
      img.onload = () => {
        const S = 96, c = document.createElement('canvas'); c.width = c.height = S;
        const g = c.getContext('2d'); const m = Math.min(img.width, img.height);
        g.fillStyle = '#fff'; g.fillRect(0,0,S,S);
        g.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function qkMoveCat(from, to){

(function initQK(){
  const body = document.getElementById('qkBody'), panel = document.getElementById('qkPanel');
  document.getElementById('qkFoldBtn').addEventListener('click', () => { qkFolded = !qkFolded; renderQK(); });
  document.getElementById('qkEditBtn').addEventListener('click', () => { if(!isBoss()) return; qkEditing = !qkEditing; renderQK(); });
  document.getElementById('qkMask').addEventListener('click', e => { if(e.target.id === 'qkMask') qkCloseMask(); });
  panel.addEventListener('dblclick', e => { const tab = e.target.closest('.qk-tab'); if(tab && qkEditing){ qkRenameCat(+tab.dataset.c); } });
  let dragMoved = false;
  panel.addEventListener('click', e => {
    if(e.target.closest('#qkFoldBtn')) return;   // 收合／展開按鈕自己處理
    if(qkFolded){ qkFolded = false; renderQK(); return; }   // 收合時，點框內任何地方就展開
    if(dragMoved){ dragMoved = false; return; }
    const tab = e.target.closest('.qk-tab');
    if(tab){
      const i = +tab.dataset.c;
      if(qkEditing && i === qkCat){ qkRenameCat(i); return; }
      qkCat = i; qkFolder = null; renderQK(); return;
    }
    if(e.target.closest('#qkBack')){ qkFolder = null; renderQK(); return; }
    const key = e.target.closest('.qk-key'); if(!key) return;
    if(key._longFired){ key._longFired = false; return; }
    const pos = +key.dataset.s, k = qkCell(pos);
    if(qkEditing){ qkEditDialog(pos); return; }
    if(!k) return;
    if(k.folder && qkFolder === null){ qkFolder = k.id; renderQK(); return; }
    qkAdd(k, 1);
  });
  // 長按（電腦：右鍵）→ 輸入數量
  let t = null;
  body.addEventListener('pointerdown', e => {
    const key = e.target.closest('.qk-key'); if(!key || qkEditing) return;
    const k = qkCell(+key.dataset.s); if(!k || k.folder) return;
    clearTimeout(t); t = setTimeout(() => { key._longFired = true; qkNumPad(k); }, 450);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => body.addEventListener(ev, () => clearTimeout(t)));
  body.addEventListener('contextmenu', e => {
    const key = e.target.closest('.qk-key'); if(!key) return;
    e.preventDefault(); if(qkEditing) return;
    const k = qkCell(+key.dataset.s); if(!k || k.folder) return;
    qkNumPad(k);
  });
  // 編輯模式拖曳（滑鼠、手指都可）
  panel.addEventListener('pointerdown', e => {
    if(!qkEditing || e.button > 0) return;
    const src = e.target.closest('.qk-key:not(.empty), .qk-tab'); if(!src) return;
    const isTab = src.classList.contains('qk-tab');
    const sx = e.clientX, sy = e.clientY; let ghost = null, over = null, started = false;
    const sel = isTab ? '.qk-tab' : '.qk-key';
    const move = ev => {
      if(!started){
        if(Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
        started = true; dragMoved = true;
        ghost = src.cloneNode(true); ghost.classList.add('qk-ghost'); ghost.style.width = src.offsetWidth + 'px'; ghost.style.height = src.offsetHeight + 'px';
        document.body.appendChild(ghost); src.classList.add('qk-drag-src');
      }
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const tgt = el && el.closest(sel);
      if(over && over !== tgt) over.classList.remove('qk-over');
      over = (tgt && tgt !== src && panel.contains(tgt)) ? tgt : null;
      if(over) over.classList.add('qk-over');
    };
    const up = () => {
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      if(ghost) ghost.remove(); if(over) over.classList.remove('qk-over'); src.classList.remove('qk-drag-src');
      if(started && over){
        if(isTab) qkMoveCat(+src.dataset.c, +over.dataset.c); else qkMoveCell(+src.dataset.s, +over.dataset.s);
      }
      if(started) setTimeout(() => { dragMoved = false; }, 0);
    };
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  });
})();

  try{
    await FBlib.login(pw);
    msg.textContent = '';
    inp.value = '';
  }catch(e){
    msg.textContent = e.code === 'auth/too-many-requests' ? '嘗試次數太多，請稍後再試'
      : e.code === 'auth/network-request-failed' ? '連不上網路，請檢查連線'
      : '密碼錯誤，請再試一次';
    inp.value = ''; inp.focus();
  }
}
document.getElementById('lockForm').addEventListener('submit', (e)=>{ e.preventDefault(); tryUnlock(); });
document.getElementById('lockBtn').addEventListener('click', ()=>{ if(window.FB) FB.logout(); else showLock(); });
applyMode();
showLock();
window.fbReady.then(FBlib=>{
  FBlib.onAuth(u=>{
    if(u && u.role){
      currentRole = u.role;
      document.body.classList.remove('locked');
      applyMode();
      startCloud();
      loadProducts(u.role);
    }else{
      if(u) FBlib.logout();
      currentRole = null;
      clearProducts();
      stopCloud();
      applyMode();
      showLock();
    }
  });
});
setTimeout(()=>{ if(!window.FB && document.body.classList.contains('locked')) document.getElementById('lockMsg').textContent = '無法載入登入元件，請檢查網路後重新整理'; }, 10000);

renderHeldOrders();
updateEditBanner();
setTxnRange('month');

init();
</script>
